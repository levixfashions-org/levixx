    <!-- Launch screen: every fresh launch of the installed app (browsers get the door intro) -->
    <style>
      #lx-splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483647;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(120% 80% at 50% 38%,#1c1c1e 0%,#0a0a0a 55%,#000 100%);color:#fff;overflow:hidden;transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
      html.lx-app #lx-splash{display:flex}
      html.lx-app,html.lx-app body{background:#0a0a0a}
      #lx-splash.lx-out{opacity:0;transform:scale(1.06);pointer-events:none}
      #lx-splash .lx-glow{position:absolute;width:78vmin;height:78vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,84,0,.30) 0%,rgba(255,84,0,.12) 30%,rgba(255,84,0,.04) 52%,transparent 70%);will-change:transform,opacity;animation:lxsPulse 3.2s ease-in-out infinite}
      #lx-splash .lx-ring{position:absolute;width:46vmin;height:46vmin;max-width:260px;max-height:260px;border-radius:50%;border:1px solid rgba(255,255,255,.08);animation:lxsRing 3s cubic-bezier(.2,.8,.2,1) infinite}
      #lx-splash .lx-logo{position:relative;width:34vmin;height:34vmin;max-width:180px;max-height:180px;border-radius:23%;}
      #lx-splash .lx-anim{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:23%;overflow:hidden;-webkit-mask-image:-webkit-radial-gradient(white,black);background:linear-gradient(135deg,#FF9445 0%,#FF5A0A 60%,#C73600 100%);box-shadow:0 24px 60px -18px rgba(255,84,0,.65),0 0 0 1px rgba(255,255,255,.08);opacity:0;-webkit-transform:scale(.86) translateY(6px);transform:scale(.86) translateY(6px);animation:lxsMark 1s cubic-bezier(.2,.8,.2,1) .2s both}
      #lx-splash .lx-p{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
      #lx-splash .lx-l{opacity:0;-webkit-transform:translateY(9%);transform:translateY(9%);animation:lxsIn .8s cubic-bezier(.2,.8,.2,1) .75s both}
      #lx-splash .lx-x{opacity:0;-webkit-transform-origin:66.7% 50%;transform-origin:66.7% 50%;-webkit-transform:translateX(11%) rotate(10deg);transform:translateX(11%) rotate(10deg);animation:lxsIn .85s cubic-bezier(.2,.8,.2,1) 1.05s both}
      #lx-splash .lx-sw{-webkit-clip-path:inset(0 100% 0 0);clip-path:inset(0 100% 0 0);animation:lxsSweep .9s cubic-bezier(.65,0,.25,1) 1.65s both}
      #lx-splash .lx-arc{stroke-dasharray:400;stroke-dashoffset:400;animation:lxsDraw 1s cubic-bezier(.65,0,.35,1) 2s both}
      #lx-splash .lx-arc2{animation-delay:2.2s}
      #lx-splash .lx-star{opacity:0;-webkit-transform-origin:46.7% 26%;transform-origin:46.7% 26%;-webkit-transform:scale(.01) rotate(-120deg);transform:scale(.01) rotate(-120deg);animation:lxsStar .7s cubic-bezier(.3,1.6,.5,1) 2.35s both,lxsTw 2.6s ease-in-out 3.3s infinite}
      #lx-splash .lx-sheen{position:absolute;top:-20%;bottom:-20%;left:0;width:26%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.5),rgba(255,255,255,0));opacity:0;-webkit-transform:translateX(-160%) skewX(-18deg);transform:translateX(-160%) skewX(-18deg);animation:lxsSheen 1.3s ease 2.9s both}
      #lx-splash .lx-halo{position:absolute;left:50%;top:50%;width:210%;height:210%;margin:-105% 0 0 -105%;border-radius:50%;background:radial-gradient(circle,rgba(255,96,20,.55) 0%,rgba(255,84,0,.22) 26%,rgba(255,84,0,.07) 46%,transparent 66%);opacity:0;will-change:opacity;animation:lxsHalo 1s ease 1.5s forwards}
      #lx-splash .lx-outline path{fill:none;stroke:#FF7A2E;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:lxsDraw 1.4s cubic-bezier(.65,0,.35,1) forwards}
      #lx-splash .lx-outline path:nth-child(2){animation-delay:.2s}
      #lx-splash .lx-outline path:nth-child(3){animation-delay:.35s}
      #lx-splash .lx-outline{will-change:opacity;animation:lxsFade .5s ease 1.65s forwards}
      #lx-splash .lx-solid{opacity:0;transform:scale(.965);will-change:opacity,transform;animation:lxsSolid .9s cubic-bezier(.2,.8,.2,1) 1.5s forwards}
      #lx-splash .lx-word{position:relative;margin-top:5.5vmin;font:900 clamp(22px,6.4vmin,34px)/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.9em;padding-left:.9em;opacity:0;animation:lxsWord 1.3s cubic-bezier(.2,.8,.2,1) 2.7s forwards}
      #lx-splash .lx-line{position:relative;width:min(64vw,300px);height:1px;margin-top:4.5vmin;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:scaleX(0);animation:lxsLine 1s cubic-bezier(.2,.8,.2,1) 3.3s forwards}
      #lx-splash .lx-tag{position:relative;max-width:92vw;margin-top:3.6vmin;text-align:center;font:700 clamp(15px,4.6vmin,21px)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.42em;padding-left:.42em;color:#fff;text-transform:uppercase;opacity:0;animation:lxsUp 1.1s ease 3.7s forwards}
      #lx-splash .lx-sub{position:relative;max-width:92vw;margin-top:12px;text-align:center;font:600 clamp(12px,3.5vmin,15px)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.3em;padding-left:.3em;color:rgba(255,255,255,.78);text-transform:uppercase;opacity:0;animation:lxsUp 1.1s ease 4.4s forwards}
      #lx-splash .lx-sub::before{content:"";display:inline-block;width:6px;height:6px;margin-right:10px;border-radius:50%;background:#FF5400;box-shadow:0 0 10px #FF5400;vertical-align:middle;transform:translateY(-1px)}
      #lx-splash .lx-skip{position:absolute;right:18px;bottom:calc(5vh + env(safe-area-inset-bottom));padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:rgba(255,255,255,.8);font:600 11px/1 system-ui,sans-serif;letter-spacing:.2em;opacity:0;animation:lxsUp .8s ease 1.2s forwards}
      #lx-splash .lx-bar{position:absolute;left:50%;bottom:calc(9vh + env(safe-area-inset-bottom));width:120px;height:2px;margin-left:-60px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
      #lx-splash .lx-bar i{position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:2px;background:linear-gradient(90deg,transparent,#FF5400,transparent);animation:lxsBar 1.6s ease-in-out infinite}
      @keyframes lxsDraw{to{stroke-dashoffset:0}}
      @keyframes lxsLine{to{transform:scaleX(1)}}
      @keyframes lxsSolid{to{opacity:1;transform:none}}@keyframes lxsMark{to{opacity:1;transform:none}}@keyframes lxsIn{to{opacity:1;transform:none}}@keyframes lxsSweep{from{-webkit-clip-path:inset(0 100% 0 0);clip-path:inset(0 100% 0 0)}to{-webkit-clip-path:inset(0 0% 0 0);clip-path:inset(0 0% 0 0)}}@keyframes lxsStar{to{opacity:1;-webkit-transform:none;transform:none}}@keyframes lxsTw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(.82) rotate(20deg)}}@keyframes lxsSheen{0%{opacity:0;transform:translateX(-160%) skewX(-18deg)}15%{opacity:1}100%{opacity:0;transform:translateX(520%) skewX(-18deg)}}@keyframes lxsShine{0%{left:-60%;opacity:1}100%{left:130%;opacity:1}}
      @keyframes lxsFade{to{opacity:0}}
      @keyframes lxsHalo{to{opacity:1}}
      @keyframes lxsWord{from{opacity:0;letter-spacing:1.6em;filter:blur(6px)}to{opacity:1;letter-spacing:.9em;filter:blur(0)}}
      @keyframes lxsUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @keyframes lxsPulse{0%,100%{transform:scale(.92);opacity:.75}50%{transform:scale(1.05);opacity:1}}
      @keyframes lxsRing{from{transform:scale(.7);opacity:.9}to{transform:scale(1.6);opacity:0}}
      @keyframes lxsBar{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
      @media (prefers-reduced-motion:reduce){#lx-splash .lx-glow,#lx-splash .lx-ring,#lx-splash .lx-bar i{animation:none}}
    </style>
    <script>
      (function () {
        try {
          var mm = function (q) { return !!(window.matchMedia && matchMedia(q).matches); };
          var app = mm('(display-mode: standalone)') || mm('(display-mode: fullscreen)') || navigator.standalone === true;
          var nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
          if (nav.type === 'reload' || nav.type === 'back_forward') return;
          var show = false, minMs = 6200;
          var home = location.pathname === '/';
          if (/\/__\/auth|accounts\.google|razorpay/.test(document.referrer || '')) return; // coming back from sign-in / payment
          // Installed app (Android or iPhone home screen): every fresh launch on the home page.
          // In a normal browser tab the website's own door intro plays instead.
          show = app && home;
          if (!show) return;
          document.documentElement.classList.add('lx-app');
          var start = Date.now();
          var hide = function () {
            var el = document.getElementById('lx-splash');
            if (!el || el.classList.contains('lx-out')) return;
            setTimeout(function () {
              el.classList.add('lx-out');
              setTimeout(function () { el.remove(); document.documentElement.classList.remove('lx-app'); }, 1100);
            }, Math.max(0, minMs - (Date.now() - start)));
          };
          window.addEventListener('load', hide);
          setTimeout(hide, 9000);
          window.__lxHideSplash = function () { start = 0; hide(); }; // never block the shop for long
        } catch (e) {}
      })();
    </script>

    <script>
      (function () {
        // Use the opening text saved in Admin → Store Settings (cached from the last visit).
        try {
          var s = JSON.parse(localStorage.getItem('levix_settings_cache') || '{}');
          var t = document.getElementById('lx-tag'), u = document.getElementById('lx-sub');
          if (typeof s.introTagline === 'string') { t.textContent = s.introTagline; if (!s.introTagline.trim()) t.style.display = 'none'; }
          if (typeof s.introSubline === 'string') { u.textContent = s.introSubline; if (!s.introSubline.trim()) u.style.display = 'none'; }
        } catch (e) {}
        var el = document.getElementById('lx-splash');
        if (document.documentElement.classList.contains('lx-app')) {
          var still = false;
          var arcs = document.querySelectorAll('#lx-splash .lx-arc');
          for (var i = 0; i < arcs.length; i++) {
            try { var L = Math.ceil(arcs[i].getTotalLength()) + 2; arcs[i].style.strokeDasharray = L; arcs[i].style.strokeDashoffset = still ? 0 : L; } catch (e) {}
          }
        }
        if (el) el.addEventListener('click', function () { if (window.__lxHideSplash) window.__lxHideSplash(); });
      })();
    </script>
